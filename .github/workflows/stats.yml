name: Refresh profile assets

# Regenerates assets/stats.svg, langs.svg, activity.svg, streak.svg and
# projects.svg, then commits them back to main.
# No third-party card service is involved, so nothing can go 503 on us.
#
# Contribution/streak data comes from the GitHub API. The language mix and the
# featured list come from committed snapshots (scripts/languages.json,
# scripts/featured.json) because every one of the owner's own repos is private
# and therefore invisible to the public API.

on:
  schedule:
    - cron: '17 4 * * *'   # daily, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-assets.mjs'
      - 'scripts/featured.json'
      - 'scripts/languages.json'
      - '.github/workflows/stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: Heinsithukyaw
        run: node scripts/generate-assets.mjs

      - name: Rebuild the circular avatar
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 scripts/make-avatar.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh profile assets [skip ci]"
            git push
          fi
