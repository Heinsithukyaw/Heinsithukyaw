name: Contribution snake

# Builds the animated snake SVG into the `output` branch.
# The README points at:
#   https://raw.githubusercontent.com/Heinsithukyaw/Heinsithukyaw/output/github-contribution-grid-snake-dark.svg
# It will 404 until this workflow has run once.

on:
  schedule:
    - cron: '23 4 * * *'   # daily, 04:23 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: Heinsithukyaw
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#5AA8DD&color_dots=#0A1929,#14345A,#2F7AB8,#5AA8DD,#9FD4F5
            dist/github-contribution-grid-snake.svg?color_snake=#2F7AB8&color_dots=#ebedf0,#c6e2f7,#8ac3ea,#3f86c4,#1d5b8f

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
