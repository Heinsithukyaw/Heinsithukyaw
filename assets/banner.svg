<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Welcome to Taungoodev's GitHub — two agents exchanging messages">
  <style>
    /* stars breathe */
    .tw { animation: tw 4.5s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.9 } }

    /* messages travel along the two lanes */
    .flow { animation: flow 3s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -56 } }

    /* the agents take turns speaking */
    .say-a { animation: sayA 10s ease-in-out infinite; }
    .say-b { animation: sayB 10s ease-in-out infinite; }
    @keyframes sayA { 0%,5% { opacity:0 } 12%,42% { opacity:1 } 50%,100% { opacity:0 } }
    @keyframes sayB { 0%,54% { opacity:0 } 61%,91% { opacity:1 } 99%,100% { opacity:0 } }

    /* visor brightens while that agent is the one talking */
    .visor-a { animation: visA 10s ease-in-out infinite; }
    .visor-b { animation: visB 10s ease-in-out infinite; }
    @keyframes visA { 0%,5% { opacity:.35 } 14%,40% { opacity:1 } 50%,100% { opacity:.35 } }
    @keyframes visB { 0%,54% { opacity:.35 } 63%,89% { opacity:1 } 99%,100% { opacity:.35 } }

    /* three-dot "speaking" indicator */
    .dot { animation: dot 1.3s ease-in-out infinite; }
    @keyframes dot { 0%,100% { opacity:.25 } 50% { opacity:1 } }

    .online { animation: onl 2.2s ease-in-out infinite; }
    @keyframes onl { 0%,100% { opacity:.35 } 50% { opacity:1 } }

    @media (prefers-reduced-motion: reduce) {
      .tw, .flow, .say-a, .say-b, .visor-a, .visor-b, .dot, .online { animation: none }
      .say-a, .say-b { opacity:1 }
    }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03060c"/>
      <stop offset="36%" stop-color="#071628"/>
      <stop offset="70%" stop-color="#0d2440"/>
      <stop offset="100%" stop-color="#16395e"/>
    </linearGradient>

    <radialGradient id="moon" cx="0.85" cy="0.12" r="0.28">
      <stop offset="0%" stop-color="#bfe0f7" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#bfe0f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="valley" cx="0.5" cy="1" r="0.62">
      <stop offset="0%" stop-color="#5fa3d8" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#2f6fa8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2f6fa8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b5a88"/>
      <stop offset="100%" stop-color="#153457"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#183f64"/>
      <stop offset="100%" stop-color="#0b2039"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1e33"/>
      <stop offset="100%" stop-color="#03090f"/>
    </linearGradient>

    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="22%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>

    <!-- ── agent visuals ─────────────────────────────────────── -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7cc0ea" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#2f7ab8" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#2f7ab8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b4a72"/>
      <stop offset="60%" stop-color="#12314f"/>
      <stop offset="100%" stop-color="#0a1e33"/>
    </linearGradient>
    <linearGradient id="laneA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f7ab8" stop-opacity="0.30"/>
      <stop offset="50%" stop-color="#9fd4f5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2f7ab8" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="laneB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4f7d" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#5aa8dd" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#1d4f7d" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="pkt" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#eaf6ff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#9fd4f5" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#9fd4f5" stop-opacity="0"/>
    </radialGradient>

    <!-- faint engineering grid behind everything -->
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#2f7ab8"/>
    </pattern>
  </defs>

  <!-- ══ sky ══════════════════════════════════════════════════ -->
  <rect width="1200" height="420" fill="url(#sky)"/>

  <g fill="#dceefb">
    <circle class="tw" cx="64"   cy="34"  r="1.3" style="animation-delay:0s"/>
    <circle class="tw" cx="142"  cy="92"  r="0.9" style="animation-delay:1.7s"/>
    <circle class="tw" cx="214"  cy="26"  r="1.4" style="animation-delay:.9s"/>
    <circle class="tw" cx="308"  cy="74"  r="0.9" style="animation-delay:2.6s"/>
    <circle class="tw" cx="386"  cy="22"  r="1.1" style="animation-delay:3.3s"/>
    <circle class="tw" cx="452"  cy="98"  r="0.9" style="animation-delay:.4s"/>
    <circle class="tw" cx="528"  cy="40"  r="1.4" style="animation-delay:2.1s"/>
    <circle class="tw" cx="596"  cy="18"  r="0.9" style="animation-delay:3.8s"/>
    <circle class="tw" cx="672"  cy="78"  r="1.2" style="animation-delay:1.2s"/>
    <circle class="tw" cx="748"  cy="30"  r="0.9" style="animation-delay:2.9s"/>
    <circle class="tw" cx="828"  cy="94"  r="1.4" style="animation-delay:.6s"/>
    <circle class="tw" cx="896"  cy="24"  r="0.9" style="animation-delay:3.5s"/>
    <circle class="tw" cx="964"  cy="70"  r="1.2" style="animation-delay:1.9s"/>
    <circle class="tw" cx="1042" cy="28"  r="0.9" style="animation-delay:.2s"/>
    <circle class="tw" cx="1112" cy="86"  r="1.4" style="animation-delay:2.4s"/>
    <circle class="tw" cx="1174" cy="38"  r="0.9" style="animation-delay:4.1s"/>
    <circle class="tw" cx="108"  cy="150" r="0.9" style="animation-delay:3.1s"/>
    <circle class="tw" cx="690"  cy="146" r="0.9" style="animation-delay:1.4s"/>
    <circle class="tw" cx="1030" cy="142" r="0.9" style="animation-delay:2.2s"/>
    <circle class="tw" cx="330"  cy="156" r="0.8" style="animation-delay:.8s"/>
    <circle class="tw" cx="806"  cy="160" r="0.8" style="animation-delay:2.7s"/>
  </g>

  <rect width="1200" height="420" fill="url(#moon)"/>
  <rect width="1200" height="330" fill="url(#dots)" opacity="0.16"/>
  <rect width="1200" height="420" fill="url(#valley)"/>

  <!-- ══ horizon band ═════════════════════════════════════════ -->
  <path fill="url(#ridgeFar)" opacity="0.9" d="
    M0 358 L58 334 L116 350 L184 310 L244 338 L310 318 L370 346 L434 306
    L492 336 L554 316 L616 344 L678 308 L738 336 L804 318 L864 346 L926 310
    L986 338 L1048 320 L1110 348 L1172 324 L1200 336 L1200 420 L0 420 Z"/>

  <path fill="url(#ridgeMid)" d="
    M0 392 L70 368 L138 382 L204 354 L266 378 L332 362 L398 386 L466 352
    L530 376 L596 360 L662 384 L728 354 L792 378 L858 362 L924 386 L990 356
    L1054 378 L1120 364 L1178 382 L1200 374 L1200 420 L0 420 Z"/>

  <path fill="url(#ridgeNear)" d="
    M0 420 L0 410 L98 398 L198 410 L298 396 L398 410 L498 400 L600 412
    L702 400 L802 412 L902 400 L1000 412 L1100 402 L1200 412 L1200 420 Z"/>

  <!-- ══ the two lanes between the agents ═════════════════════ -->
  <path d="M250,236 Q600,140 950,236" fill="none" stroke="url(#laneA)"
        stroke-width="1.6" stroke-dasharray="6 8" stroke-linecap="round" class="flow"/>

  <path d="M250,236 Q600,332 950,236" fill="none" stroke="url(#laneB)"
        stroke-width="1.6" stroke-dasharray="6 8" stroke-linecap="round" class="flow"
        style="animation-duration:3.6s"/>

  <!-- packets: a → b on the upper lane -->
  <g>
    <animateMotion dur="4s" begin="0s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;1" keyTimes="0;1" path="M250,236 Q600,140 950,236"/>
    <animate attributeName="opacity" dur="4s" begin="0s" repeatCount="indefinite"
             values="0;1;1;0" keyTimes="0;0.12;0.88;1"/>
    <circle r="12" fill="url(#pkt)"/><circle r="3.8" fill="#eaf6ff"/>
  </g>
  <g>
    <animateMotion dur="4s" begin="2s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;1" keyTimes="0;1" path="M250,236 Q600,140 950,236"/>
    <animate attributeName="opacity" dur="4s" begin="2s" repeatCount="indefinite"
             values="0;1;1;0" keyTimes="0;0.12;0.88;1"/>
    <circle r="12" fill="url(#pkt)"/><circle r="3.8" fill="#eaf6ff"/>
  </g>

  <!-- packets: b → a on the lower lane -->
  <g>
    <animateMotion dur="4s" begin="1s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="1;0" keyTimes="0;1" path="M250,236 Q600,332 950,236"/>
    <animate attributeName="opacity" dur="4s" begin="1s" repeatCount="indefinite"
             values="0;1;1;0" keyTimes="0;0.12;0.88;1"/>
    <circle r="10" fill="url(#pkt)"/><circle r="3.2" fill="#cfe9fb"/>
  </g>
  <g>
    <animateMotion dur="4s" begin="3s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="1;0" keyTimes="0;1" path="M250,236 Q600,332 950,236"/>
    <animate attributeName="opacity" dur="4s" begin="3s" repeatCount="indefinite"
             values="0;1;1;0" keyTimes="0;0.12;0.88;1"/>
    <circle r="10" fill="url(#pkt)"/><circle r="3.2" fill="#cfe9fb"/>
  </g>

  <!-- ══ AGENT A ══════════════════════════════════════════════ -->
  <g transform="translate(250 236) scale(1.12)">
    <circle r="76" fill="url(#glow)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <!-- orbit ring + orbiting tool nodes -->
    <circle r="56" fill="none" stroke="#2f7ab8" stroke-width="1" stroke-opacity="0.35"/>
    <g opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360"
                        dur="30s" repeatCount="indefinite"/>
      <circle cx="56" cy="0" r="4.2" fill="#5aa8dd"/>
      <circle cx="-28" cy="48.5" r="3.4" fill="#2f7ab8"/>
      <circle cx="-28" cy="-48.5" r="3.4" fill="#2f7ab8"/>
    </g>
    <circle r="44" fill="none" stroke="#3f86c4" stroke-width="1" stroke-dasharray="4 7" stroke-opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0"
                        dur="18s" repeatCount="indefinite"/>
    </circle>

    <!-- the agent itself -->
    <line x1="0" y1="-34" x2="0" y2="-43" stroke="#5aa8dd" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-46" r="3.4" fill="#cfe9fb">
      <animate attributeName="r" values="3;4.8;3" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.55;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <rect x="-32" y="-15" width="8" height="17" rx="4" fill="#173d61" stroke="#3f86c4" stroke-width="1"/>
    <rect x="24"  y="-15" width="8" height="17" rx="4" fill="#173d61" stroke="#3f86c4" stroke-width="1"/>
    <rect x="-25" y="-32" width="50" height="48" rx="14" fill="url(#head)"
          stroke="#5aa8dd" stroke-width="1.4" stroke-opacity="0.7"/>
    <rect x="-17" y="-20" width="34" height="17" rx="8.5" fill="#050f1c" stroke="#2f7ab8"
          stroke-width="1" stroke-opacity="0.85"/>
    <g class="visor-a">
      <circle cx="-7.5" cy="-11.5" r="3.4" fill="#bfe4fa"/>
      <circle cx="7.5"  cy="-11.5" r="3.4" fill="#bfe4fa"/>
    </g>
    <circle cx="-7.5" cy="-11.5" r="3.4" fill="#7cc0ea" opacity="0.55">
      <animate attributeName="r" values="3.4;3.4;0.4;3.4" keyTimes="0;0.86;0.92;1"
               dur="5.4s" repeatCount="indefinite"/>
    </circle>
    <rect x="-11" y="4" width="22" height="3" rx="1.5" fill="#2f7ab8" opacity="0.85"/>
    <rect x="-6"  y="10" width="12" height="2.6" rx="1.3" fill="#2f7ab8" opacity="0.5"/>
  </g>

  <!-- agent A speaks -->
  <g class="say-a">
    <rect x="212" y="128" width="76" height="28" rx="14" fill="#0E2036"
          stroke="#2f7ab8" stroke-width="1.2" stroke-opacity="0.9"/>
    <path d="M240 155 L250 168 L258 155 Z" fill="#0E2036" stroke="#2f7ab8"
          stroke-width="1.2" stroke-opacity="0.9"/>
    <circle class="dot" cx="228" cy="142" r="3.2" fill="#9fd4f5" style="animation-delay:0s"/>
    <circle class="dot" cx="250" cy="142" r="3.2" fill="#9fd4f5" style="animation-delay:.21s"/>
    <circle class="dot" cx="272" cy="142" r="3.2" fill="#9fd4f5" style="animation-delay:.42s"/>
  </g>

  <text x="158" y="242" font-size="13" font-family="Menlo, Monaco, 'SF Mono', Consolas, monospace"
        letter-spacing="1.6" fill="#74b2de" text-anchor="end">agent_a</text>

  <!-- ══ AGENT B ══════════════════════════════════════════════ -->
  <g transform="translate(950 236) scale(1.12)">
    <circle r="76" fill="url(#glow)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    </circle>

    <circle r="56" fill="none" stroke="#2f7ab8" stroke-width="1" stroke-opacity="0.35"/>
    <g opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0"
                        dur="30s" repeatCount="indefinite"/>
      <circle cx="-56" cy="0" r="4.2" fill="#5aa8dd"/>
      <circle cx="28" cy="-48.5" r="3.4" fill="#2f7ab8"/>
      <circle cx="28" cy="48.5" r="3.4" fill="#2f7ab8"/>
    </g>
    <circle r="44" fill="none" stroke="#3f86c4" stroke-width="1" stroke-dasharray="4 7" stroke-opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360"
                        dur="18s" repeatCount="indefinite"/>
    </circle>

    <line x1="0" y1="-34" x2="0" y2="-43" stroke="#5aa8dd" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-46" r="3.4" fill="#cfe9fb">
      <animate attributeName="r" values="3;4.8;3" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.55;1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <rect x="-32" y="-15" width="8" height="17" rx="4" fill="#173d61" stroke="#3f86c4" stroke-width="1"/>
    <rect x="24"  y="-15" width="8" height="17" rx="4" fill="#173d61" stroke="#3f86c4" stroke-width="1"/>
    <rect x="-25" y="-32" width="50" height="48" rx="14" fill="url(#head)"
          stroke="#5aa8dd" stroke-width="1.4" stroke-opacity="0.7"/>
    <rect x="-17" y="-20" width="34" height="17" rx="8.5" fill="#050f1c" stroke="#2f7ab8"
          stroke-width="1" stroke-opacity="0.85"/>
    <g class="visor-b">
      <circle cx="-7.5" cy="-11.5" r="3.4" fill="#bfe4fa"/>
      <circle cx="7.5"  cy="-11.5" r="3.4" fill="#bfe4fa"/>
    </g>
    <circle cx="7.5" cy="-11.5" r="3.4" fill="#7cc0ea" opacity="0.55">
      <animate attributeName="r" values="3.4;3.4;0.4;3.4" keyTimes="0;0.86;0.92;1"
               dur="5.4s" begin="2.7s" repeatCount="indefinite"/>
    </circle>
    <rect x="-11" y="4" width="22" height="3" rx="1.5" fill="#2f7ab8" opacity="0.85"/>
    <rect x="-6"  y="10" width="12" height="2.6" rx="1.3" fill="#2f7ab8" opacity="0.5"/>
  </g>

  <!-- agent B speaks -->
  <g class="say-b">
    <rect x="912" y="128" width="76" height="28" rx="14" fill="#0E2036"
          stroke="#2f7ab8" stroke-width="1.2" stroke-opacity="0.9"/>
    <path d="M942 155 L950 168 L960 155 Z" fill="#0E2036" stroke="#2f7ab8"
          stroke-width="1.2" stroke-opacity="0.9"/>
    <circle class="dot" cx="928" cy="142" r="3.2" fill="#9fd4f5" style="animation-delay:0s"/>
    <circle class="dot" cx="950" cy="142" r="3.2" fill="#9fd4f5" style="animation-delay:.21s"/>
    <circle class="dot" cx="972" cy="142" r="3.2" fill="#9fd4f5" style="animation-delay:.42s"/>
  </g>

  <text x="1042" y="242" font-size="13" font-family="Menlo, Monaco, 'SF Mono', Consolas, monospace"
        letter-spacing="1.6" fill="#74b2de" text-anchor="start">agent_b</text>

  <!-- ══ title ════════════════════════════════════════════════ -->
  <g font-family="Menlo, Monaco, 'SF Mono', Consolas, 'Courier New', monospace" text-anchor="middle">
    <text x="600" y="60" font-size="14.5" letter-spacing="7.5" fill="#9cc9ea" opacity="0.95">WELCOME&#160;TO</text>
    <text x="600" y="108" font-size="40" letter-spacing="1.2" fill="#f4faff" font-weight="600">Taungoodev&#39;s GitHub</text>
    <text x="600" y="136" font-size="17" letter-spacing="3" fill="#74b2de">&lt;/&gt;</text>
  </g>

  <!-- ══ corner micro-labels ══════════════════════════════════ -->
  <text x="34" y="40" font-size="11" letter-spacing="2.4"
        font-family="Menlo, Monaco, Consolas, monospace" fill="#3f86c4" opacity="0.85">agent-mesh</text>
  <g>
    <circle class="online" cx="1090" cy="36" r="3.6" fill="#5aa8dd"/>
    <text x="1102" y="40" font-size="11" letter-spacing="2.4"
          font-family="Menlo, Monaco, Consolas, monospace" fill="#3f86c4" opacity="0.85">online</text>
  </g>

  <rect width="1200" height="420" fill="url(#vignette)"/>
</svg>
