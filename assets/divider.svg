<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="900" height="28" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4f7d" stop-opacity="0"/>
      <stop offset="22%" stop-color="#2f7ab8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#5aa8dd" stop-opacity="0.9"/>
      <stop offset="78%" stop-color="#2f7ab8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1d4f7d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fd4f5"/>
      <stop offset="100%" stop-color="#3f86c4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="13" width="900" height="2" fill="url(#rule)"/>

  <!-- centre node -->
  <g transform="translate(450 14)">
    <circle r="11" fill="#0a1929"/>
    <circle r="11" fill="none" stroke="#2f7ab8" stroke-width="1.4" opacity="0.9"/>
    <path d="M0 -6.5 L5.6 0 L0 6.5 L-5.6 0 Z" fill="url(#core)"/>
  </g>

  <!-- satellite nodes -->
  <g fill="#0a1929" stroke="#2f7ab8" stroke-width="1.2" opacity="0.85">
    <circle cx="330" cy="14" r="4.5"/>
    <circle cx="570" cy="14" r="4.5"/>
  </g>
</svg>
