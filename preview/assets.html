<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Asset sheet</title>
<style>
  body{margin:0;background:#0d1117;padding:24px;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#7a93ab}
  .row{margin-bottom:26px}
  .lbl{font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;color:#5aa8dd}
  .pair{display:flex;gap:14px;align-items:flex-start}
  img{display:block}
  .banner{width:1200px}
  .half{width:480px}
  .wide{width:880px}
</style>
</head>
<body>
  <div class="row"><div class="lbl">banner.svg</div><img class="banner" src="../assets/banner.svg"></div>
  <div class="row"><div class="lbl">divider.svg</div><img style="width:648px" src="../assets/divider.svg"></div>
  <div class="row"><div class="lbl">avatar.png</div><img style="width:200px" src="../assets/avatar.png"></div>
  <div class="row"><div class="lbl">activity.svg</div><img class="wide" src="../assets/activity.svg"></div>
  <div class="row"><div class="lbl">stats.svg + langs.svg</div>
    <div class="pair">
      <img class="half" src="../assets/stats.svg">
      <img class="half" src="../assets/langs.svg">
    </div>
  </div>
  <div class="row"><div class="lbl">streak.svg</div><img style="width:720px" src="../assets/streak.svg"></div>
  <div class="row"><div class="lbl">projects.svg</div><img class="wide" src="../assets/projects.svg"></div>
</body>
</html>
